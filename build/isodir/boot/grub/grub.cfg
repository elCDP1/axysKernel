set timeout=0
set default=0

# Keep GRUB diagnostics available on both BIOS and UEFI boots, and do not
# require a graphical mode before transferring control to the kernel.
serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

menuentry "axys kernel" {
    multiboot2 /boot/axys.elf
    boot
}
